# ===================================================================
# E2E Construction Management System - Application Configuration
# ===================================================================

spring.application.name=e2e-construction-management
server.port=${SERVER_PORT:8080}

# ===================================================================
# MySQL Database Configuration
# Supports Environment Variables: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:e2e_construction_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.pool-name=ConstructionHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ===================================================================
# Spring Data JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# JWT (JSON Web Token) Configuration
# ===================================================================
# 256-bit secret key for HMAC-SHA256 signature
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 86400000 ms = 24 hours
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# File Upload Configuration (Machinery Images)
# ===================================================================
file.upload-dir=${FILE_UPLOAD_DIR:uploads/machinery}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
